name: Update whisper-cpp-vulkan

on:
  schedule:
    - cron: '0 6 * * *'   # once a day, 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild and release even if version unchanged'
        type: boolean
        default: false
  
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Prep environment
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja \
            spirv-headers vulkan-headers vulkan-icd-loader jq curl sudo

          # makepkg не разрешает работать под root — создаём билд-юзера
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get latest upstream tag
        id: latest
        run: |
          latest=$(curl -s "https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=30" \
            | jq -r '[.[] | select(.prerelease==false) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tag_name' \
            | sed 's/^v//')
          current=$(grep -Po '^pkgver=\K.*' PKGBUILD)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Decide whether to proceed
        id: decide
        run: |
          if [ "${{ steps.latest.outputs.latest }}" != "${{ steps.latest.outputs.current }}" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump pkgver if needed
        if: steps.decide.outputs.run == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.latest.outputs.latest }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Build package
        if: steps.decide.outputs.run == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -sf --noconfirm --skippgpcheck

      - name: Commit updated PKGBUILD
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          git commit -m "Update to v${{ steps.latest.outputs.latest }}"
          git push

      - name: Prepare release assets
        if: steps.decide.outputs.run == 'true'
        run: |
          pkgver=$(grep -Po '^pkgver=\K.*' PKGBUILD)
          pkgrel=$(grep -Po '^pkgrel=\K.*' PKGBUILD)
          cp "whisper-cpp-vulkan-${pkgver}-${pkgrel}-x86_64.pkg.tar.zst" whisper-cpp-vulkan-x86_64.pkg.tar.zst

      - name: Create release
        if: steps.decide.outputs.run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.latest.outputs.latest }}-1
          name: v${{ steps.latest.outputs.latest }}-1
          body: |
            Prebuilt binary package for Arch Linux. Can be manually downloaded and installed using `sudo pacman -U whisper-cpp-vulkan*.pkg.tar.zst`
            The plain binary itself can be extracted and resulting files can be launched/placed like a portable installation (see `Option 3` of installation in README.md)
          files: |
            *.pkg.tar.zst
